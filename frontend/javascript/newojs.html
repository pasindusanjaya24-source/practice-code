<!DOCTYPE html>
<html>
<head>
	<title>on view</title>
</head>
<body>
<script>
	let marks=[10,20,30,40,50,60,70,80,100,90];
	function display(marks){
		for(let i=0;i<marks.length;i++){
			document.write(marks[i]+" ");
		}
	}
	
	function calculateAverage(marks){
		let sum=0;
		for(let i=0;i<marks.length;i++){
			sum+=marks[i];
		}
		return (sum/marks.length);
	}
	
	function check(marks){
		let min=marks[0];
		let max=marks[0];
		for(let i=0;i<marks.length;i++){
			if(marks[i]>max){
				max=marks[i];
			}
			if(marks[i]<min){
				min=marks[i];
			}
		}
	document.write("the lowest value is "+min);
	document.write("<br>");
	document.write("the highest value is "+max);
	document.write("<br>");
	}
	
	
	document.write("<h1><center>Student Details</center></h1>");
	document.write("student marks:  ");
	
	display(marks);
	document.write("<br>");
	document.write("student marks average is: "+calculateAverage(marks));
	
	document.write("<br>");
	check(marks);
	let a=Number(prompt("Enter a number:"));
	let b=Number(prompt("Enter a another number"));
	document.write(a+b);
	

</script>
</body>
</html>
