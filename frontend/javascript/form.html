<!DOCTYPE html>
<html>
<head>

<title>my form</title>

</head>
<body>
<div>
<fieldset>
<legend align="center"><font size="20">Form</font></legend>
<form method="post" >
<label>Name:</label>
<input type="text" id="text" placeholder="Enter Name" required ><br><br>
<label>Email:</label>
<input type="email" id="email" placeholder="EX:Amal12@gmail.com" required>
<br><br><input type="submit" id="submit" value="Submit">
<input type="reset" id="reset" value="Reset">

</form>
</fieldset>
</div>
<script>
const form =document.querySelector("form");
form.addEventListener("submit",function(event){
	event.preventDefault();
	alert("Succesfully !");
	
});
</script>
   
</body>
</html>
