<html>
<head>
	<title>new js document</title>
	<script>
	let marks=[10,20,30,40,50,60,70,80,90,10];
	function calculateAverage(marks){
		let sum=0;
		for(let i=0;i<10;i++){
		sum+=marks[i];
		
		}
		return sum/10;
	}
	document.write("<h1>All Student marks</h1>");
	for(let i=0;i<10;i++){
		document.write(marks[i]+" ");
	}
	document.write("<h2>Average mark</h2>");
	document.write( "<br>"+calculateAverage(marks));
	document.write("<h2>Highest mark</h2>");
		let max=marks[0];
		for(let i=0;i<10;i++){
			if(marks[i]>=max){
			max=marks[i];
			}
		}
		
	document.write(max);
	document.write("<h2>Lowest mark</h2>");
	let min=marks[0];
	for(let i=0;i<marks.length;i++){
		if(marks[i]<=min){
			min=marks[i];		}
	}
	document.write(min);
	
	</script>
</head>
<body>
</body>
</html>
