<!DOCTYPE html>
<html>
<head>
	<title>web form</title>
	<meta charset="	UTF-8">
	<meta name="viewport">
	<link rel="stylesheet" href="stt.css">
</head>
<body>
	<fieldset>
	
		<legend align="center">HTML Form set</legend>
		<form action="process.php" method="post" >
		<table cellspacing="10" cellpadding="4" align="center">
		
			<tr>
				<td width="100">Name</td>
				<td><input type="text" placeholder="enter naem"></td>
			</tr>
			<tr>
				<td>Address</td>
				<td><input type="text" name="textaddress" ></td>
			</tr>
			<tr>
				<td>Email</td>
				<td><input type="email"  Name="email" placeholder="enter email"></td>
			</tr>
			<tr>
				<td>Gender</td>
				<td>
				    <input type="radio" name="g">Male
				    <input type="radio" name="g">Female
				</td>
			</tr>
		    <tr>
				<td>Hobbies</td>
				<td>
				    <input type="checkbox" name="g">Sport
				    <input type="checkbox" name="g">Movie
				    <input type="checkbox" name="g">Traveling
				</td>
			</tr>
			<tr>
				<td>Country </td>
				<td><select>
					<option>Sri lanka</option>
					<option selected>Nepal</option>
					<option>India</option>
					<option>Paksitan</option>
			   </select> </td>
			</tr>
			<tr>
				<td>Message</td>
				<td><textarea name="textaddress" rows="8" cols="30"></textarea></td>
			</tr>
			<tr>
				<td>&nbsp</td>
				<td  ><input type="submit" value="Submit" class="btn">&nbsp &nbsp<input type="Reset" value="Reset" class="btn"> <input type="file" value="choose file"></td>
			</tr>
		
		</table>
	
	</form>

	</fieldset>
</body>
</html>
