<!DOCTYPE html>
<html>
<head>
    <title>my form</title>
    <link rel="stylesheet" href="form1.css">
    <style>
        input {
            border-radius: 6px;
            font-size: 20px;
            font-family: Arial, sans-serif;
        }
    </style>
    
    <script src="form1.js" defer></script>
</head>
<body>
<center>
    <div class="c">
        <h1>Create Account</h1>
       
        <form id="myForm" method="post"> 
            <label>UserName:</label>
            <input type="text" placeholder="Enter Name" required><br><br>
            
            <label>Email:</label>
            <input type="email" id="email" required><br><br>
            
           
            <label>Password:</label>
            <input type="password" id="password" placeholder="amila@123#" required><br><br>
            
            <label>Confirm Password:</label>
            <input type="password" id="confirmPassword" placeholder="amila@123#" required><br><br>
            
            
            <p id="message"></p>

            <input type="submit" value="Submit" class="btn">
            <input type="reset" value="Reset" class="btn">
        </form>
    </div>
	<div class="card">
    <span class="badge">NEW</span>
    <h3>Class M1 Locomotive</h3>
</div>
<!-- ප්‍රධාන Grid Container එක -->
<div class="product-grid">
    
    <!-- 1 වෙනි Product Card එක -->
    <div class="product-card">
        <span class="discount-badge">-52%</span> <!-- Absolute positioning -->
        <img src="2026-06-20 at 14.27.56.jpeg" alt="Dish Wash">
        <div class="card-details"> <!-- Flexbox (Column) -->
            <h4>Dish Wash Liquid 4L</h4>
            <span class="price">Rs. 714</span>
            <span class="old-price">Rs. 1,500</span>
        </div>
    </div>

    <!-- තවත් Product Cards මෙලෙසම එකතු වේ... -->
</div>
</center>
</body>
</html>
